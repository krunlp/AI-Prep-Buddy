title: AI Prep Buddy
description: 1500+ interview questions, answer frameworks, architecture diagrams, and code solutions for AI/ML system design interviews
theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - README.md
  - answers.md
  - diagrams.md
  - patterns.md
  - code-solutions.md
  - study-paths.md
