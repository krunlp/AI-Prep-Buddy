title: AI Prep Buddy
description: 1600+ interview questions, answer frameworks, architecture diagrams, and code solutions for AI/ML system design interviews
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - README.md
  - index.md
  - questions.md
  - answers.md
  - diagrams.md
  - patterns.md
  - code-solutions.md
  - study-paths.md
  - company-prep.md
  - cheatsheet.md
  - glossary.md
  - sources.md
  - simulator.html
