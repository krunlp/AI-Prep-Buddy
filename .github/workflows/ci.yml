name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Structural integrity of the question bank.
      # Catches: duplicate numbers, numbering gaps, unanswered questions,
      # orphan answers, section range overlaps, mismatched section headers,
      # and derived artifacts drifting out of sync with the source of truth.
      - name: Verify question bank integrity
        run: python3 scripts/verify_integrity.py

      # Fails if questions.md / answers.md were edited without regenerating
      # data/questions.json, simulator.html, README.md and index.html.
      - name: Verify derived artifacts are in sync
        run: python3 scripts/sync_derived.py --check

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
